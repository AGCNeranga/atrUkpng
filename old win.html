<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVIP PLATINUM - TOTAL CAPTURE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --vvip-bg: #f8fafb;
            --platinum-pearl: #ffffff;
            --royal-gold: #b8860b;
            --deep-onyx: #121417;
            --accent-mint: #e8f4f1;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; transition: 0.2s ease; }
        body { background: var(--vvip-bg); color: var(--deep-onyx); margin: 0; padding: 40px 20px; user-select: none; }
        .container { max-width: 1300px; margin: auto; }

        /* VVIP Header */
        header { text-align: center; margin-bottom: 50px; }
        .logo-text { font-weight: 200; font-size: 3rem; letter-spacing: 8px; margin: 0; text-transform: uppercase; }
        .sub-text { color: var(--royal-gold); font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; }

        /* Dashboard Input Panels */
        .dashboard-top { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        .glass-panel { 
            background: var(--platinum-pearl); padding: 35px; border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.04); border: 1px solid rgba(255,255,255,0.8);
        }

        textarea { 
            width: 100%; height: 160px; border: 1px solid #eef0f2; border-radius: 18px; 
            padding: 20px; font-size: 14px; background: #fafbfc; outline: none; resize: none;
        }

        .upload-trigger {
            height: 160px; border: 2px dashed #d1d5db; border-radius: 18px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; color: #9ca3af; background: #fafbfc;
        }
        .upload-trigger:hover { border-color: var(--royal-gold); background: #fff; color: var(--royal-gold); }

        /* Command Center Bar */
        .command-center {
            background: var(--deep-onyx); padding: 25px 50px; border-radius: 100px;
            display: none; align-items: center; justify-content: space-between;
            margin-bottom: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            position: sticky; top: 30px; z-index: 9999;
        }

        .btn-vvip {
            border: none; padding: 14px 32px; border-radius: 50px;
            cursor: pointer; font-weight: 700; font-size: 12px;
            text-transform: uppercase; letter-spacing: 1.5px;
        }
        .btn-gold { background: var(--royal-gold); color: white; box-shadow: 0 10px 20px rgba(184, 134, 11, 0.2); }
        .btn-gold:hover { transform: scale(1.05); filter: brightness(1.1); }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #fff; }
        .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

        /* Grid Results */
        .jacket-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
        .jacket-card {
            background: #fff; padding: 25px; border-radius: 25px; text-align: center;
            border: 2px solid transparent; cursor: pointer; position: relative;
        }
        .jacket-card.selected { border-color: var(--royal-gold); background: var(--accent-mint); transform: translateY(-5px); }
        .jacket-card img { width: 110px; height: 110px; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.08)); }
        .jacket-card p { margin-top: 20px; font-weight: 800; font-size: 12px; color: #333; }

        /* Status Labels */
        .stat-badge { background: rgba(255,255,255,0.05); color: var(--royal-gold); padding: 10px 25px; border-radius: 50px; font-size: 13px; font-weight: bold; }
        .loading-overlay { position: fixed; top: 20px; right: 20px; background: var(--royal-gold); color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; display: none; z-index: 10000; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="speedLoader" class="loading-overlay">⚡ BYPASSING SERVER LIMITS... EXPORTING...</div>

<div class="container">
    <header>
        <h1 class="logo-text">Platinum</h1>
        <div class="sub-text">ULTRA-HIGH BYPASS SYSTEM DASHBOARD</div>
    </header>

    <div class="dashboard-top">
        <div class="glass-panel">
            <textarea id="pasteBox" placeholder="PASTE CODE HERE..."></textarea>
            <button class="btn-vvip btn-gold" style="width:100%; margin-top:20px;" onclick="runCapture()">INITIALIZE TOTAL CAPTURE</button>
        </div>
        <div class="glass-panel">
            <div class="upload-trigger" onclick="document.getElementById('fileInput').click()">
                <span style="font-size: 40px; margin-bottom: 10px;">◈</span>
                <span style="font-weight: bold; letter-spacing: 1px;">UPLOAD SYSTEM FILE</span>
            </div>
            <input type="file" id="fileInput" hidden accept=".txt,.html">
        </div>
    </div>

    <div id="cmdBar" class="command-center">
        <div style="display:flex; gap:12px">
            <button class="btn-vvip btn-outline" onclick="massSelect(true)">Select All</button>
            <button class="btn-vvip btn-outline" onclick="massSelect(false)">Clear</button>
        </div>
        
        <div id="counter" class="stat-badge">0 JACKETS DETECTED</div>

        <div style="display:flex; gap:12px">
            <button class="btn-vvip btn-gold" onclick="turboExport('png')">ZIP PNG</button>
            <button class="btn-vvip btn-gold" onclick="turboExport('jpg')">ZIP JPG</button>
            <button class="btn-vvip btn-outline" style="border-color:#ff4757; color:#ff4757" onclick="generatePdf()">PDF REPORT</button>
        </div>
    </div>

    <div id="mainGrid" class="jacket-grid"></div>
</div>

<script>
    let jacketStorage = [];

    // Clean name: Removes leading/trailing underscores and country suffixes like (IRE)
    function getCleanName(originalName, fallbackIndex) {
        let clean = originalName.trim();
        // Remove country suffixes like (IRE), (GB), (USA), (FR) etc.
        clean = clean.replace(/\s*\([A-Z]+\)\s*$/g, '');
        // Remove leading/trailing underscores and extra spaces
        clean = clean.replace(/^_+|_+$/g, '').trim();
        
        return clean || "jacket_" + fallbackIndex;
    }

    // Security: Block DevTools
    document.onkeydown = (e) => {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
    };

    document.getElementById('fileInput').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => processHTML(ev.target.result);
        reader.readAsText(e.target.files[0]);
    };

    function runCapture() { processHTML(document.getElementById('pasteBox').value); }

    function processHTML(html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const items = doc.querySelectorAll('.card-entry, .horse-silk');
        const duplicates = new Set();
        jacketStorage = [];

        items.forEach(item => {
            const img = item.querySelector('img');
            const horse = item.querySelector('.horse__link, .horse-name, a');
            
            if (img && horse) {
                let src = img.getAttribute('src');
                if (src && src.startsWith('/')) src = "https://www.attheraces.com" + src;
                
                if (src && !src.includes('spacer.gif') && !duplicates.has(src)) {
                    duplicates.add(src);
                    jacketStorage.push({
                        name: horse.textContent.trim() || "Unknown_Horse",
                        url: src,
                        selected: true
                    });
                }
            }
        });
        updateDashboard();
    }

    function updateDashboard() {
        const grid = document.getElementById('mainGrid');
        const bar = document.getElementById('cmdBar');
        grid.innerHTML = '';
        
        if (jacketStorage.length > 0) {
            bar.style.display = 'flex';
            jacketStorage.forEach((j, i) => {
                const displayName = getCleanName(j.name, i); 
                const card = document.createElement('div');
                card.className = `jacket-card ${j.selected ? 'selected' : ''}`;
                card.onclick = () => { jacketStorage[i].selected = !j.selected; updateDashboard(); };
                card.innerHTML = `<img src="${j.url}"><p>${displayName}</p>`;
                grid.appendChild(card);
            });
        }
        document.getElementById('counter').innerText = `${jacketStorage.filter(j=>j.selected).length} JACKETS READY`;
    }

    function massSelect(v) {
        jacketStorage.forEach(j => j.selected = v);
        updateDashboard();
    }

    async function turboExport(format) {
        const targets = jacketStorage.filter(j => j.selected);
        if (targets.length === 0) return;

        const loader = document.getElementById('speedLoader');
        loader.style.display = 'block';

        const zip = new JSZip();
        const proxies = [
            "https://api.allorigins.win/raw?url=",
            "https://corsproxy.io/?"
        ];

        const downloadJobs = targets.map(async (j, index) => {
            let success = false;
            let attempts = 0;

            while (!success && attempts < 2) {
                try {
                    const proxyUrl = proxies[attempts] + encodeURIComponent(j.url);
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error();
                    
                    const blob = await response.blob();
                    const cleanName = getCleanName(j.name, index);
                    zip.file(`${cleanName}.${format}`, blob);
                    success = true;
                } catch (e) {
                    attempts++;
                }
            }
        });

        await Promise.all(downloadJobs);

        const content = await zip.generateAsync({type: "blob", compression: "STORE"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `Platinum_Export_${format.toUpperCase()}.zip`;
        link.click();
        
        loader.style.display = 'none';
    }

    function generatePdf() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let y = 20;
        doc.setFont("helvetica", "bold").text("VVIP HORSE JACKET INVENTORY", 20, y);
        y += 20;
        doc.setFontSize(10).setFont("helvetica", "normal");
        jacketStorage.filter(j => j.selected).forEach((j, i) => {
            if (y > 280) { doc.addPage(); y = 20; }
            const cleanName = getCleanName(j.name, i);
            doc.text(`${i + 1}. ${cleanName}`, 20, y);
            y += 8;
        });
        doc.save("VVIP_Jacket_Report.pdf");
    }
</script>

</body>
</html>
